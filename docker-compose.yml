services:
  db:
    image: postgres:16-alpine
    container_name: fieldproof-db
    environment:
      POSTGRES_PASSWORD: devsecret
      POSTGRES_DB: fieldproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldproof-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
